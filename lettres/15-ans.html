<script>

const dateOuverture = new Date("2030-07-01T00:00:00");

function verifierLettre() {

    const maintenant = new Date();
    const zone = document.getElementById("contenu");

    if (maintenant >= dateOuverture) {

        zone.innerHTML = `
        <h1>Pour tes 15 ans, Fama ❤️</h1>

        <p>
        Ma chère Fama,
        </p>

        <p>
        Cette lettre était gardée pour ce moment.
        J'espère qu'elle t'accompagnera dans cette
        nouvelle étape de ta vie.
        </p>

        `;

    } else {

        const difference = dateOuverture - maintenant;

        const jours = Math.floor(difference / (1000 * 60 * 60 * 24));

        zone.innerHTML = `
        
        <div class="lock">🔒</div>

        <h1>Une lettre pour tes 15 ans</h1>

        <p>
        Cette lettre est précieusement gardée.
        </p>

        <p>
        Elle s'ouvrira le :
        <strong>1er juillet 2030</strong>
        </p>

        <p>
        Encore <strong>${jours} jours</strong>
        avant de découvrir ces mots...
        </p>

        `;

    }
}

window.onload = verifierLettre;

</script>
